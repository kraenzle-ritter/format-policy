name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - run: composer validate --strict

      - run: composer update --prefer-dist --no-progress

      - name: Install the tools the policies call
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg flac imagemagick libimage-exiftool-perl libtiff-tools
          curl -sSL -o /tmp/siegfried.deb https://github.com/richardlehane/siegfried/releases/download/v1.11.9/siegfried_1.11.9-1_amd64.deb
          sudo apt-get install -y -q /tmp/siegfried.deb
          sf -version

      - run: composer test

      - run: composer analyse
